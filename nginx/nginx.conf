
# ============================================================
# Nginx - Reverse Proxy HTTPS pour l'application FSAC
# ============================================================
# Redirige tout le trafic HTTP → HTTPS
# Gère le SSL/TLS, Flask reste en HTTP interne (port 5000)
# ============================================================

# Optimisation : nb de workers = nb de CPU
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─── Redirection HTTP → HTTPS ─────────────────────────────
    server {
        listen 80;
        server_name _;

        # Challenge Let's Encrypt (renouvellement automatique)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tout le reste → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── Serveur HTTPS ────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Certificats SSL (Let's Encrypt en prod, auto-signé en dev)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Protocoles TLS sécurisés uniquement
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Cache des sessions SSL
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # En-têtes de sécurité HTTP
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Permet les téléchargements de PDF sans avertissement Chrome
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'self';" always;

        # ── Proxy vers Flask/Gunicorn ──────────────────────────
        location / {
            proxy_pass         http://web:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── Fichiers statiques servis directement par Nginx ────
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
